<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delegation System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- ========================= -->
        <!-- HEADER -->
        <!-- ========================= -->

        <h1>Delegation System</h1>


        <!-- ========================= -->
        <!-- TABS -->
        <!-- ========================= -->

        <div class="tabs">

            <button
                class="tab active"
                onclick="showSection('addTask', this)">
                Add New Task
            </button>

            <button
                class="tab"
                onclick="showSection('followUp', this)">
                Follow Up
            </button>

            <button
                class="tab"
                onclick="showSection('pendingTasks', this)">
                All Pending Tasks
            </button>

        </div>


        <!-- ========================= -->
        <!-- ADD NEW TASK -->
        <!-- ========================= -->

        <section id="addTask" class="section">

            <div class="form-row">

                <!-- DOER -->

                <select id="doerSelect">

                    <option value="">
                        Select Doer
                    </option>

                </select>


                <!-- PLANNED DATE -->

                <input
                    type="date"
                    id="plannedDate">

            </div>


            <!-- TASK DESCRIPTION -->

            <textarea
                id="taskDescription"
                placeholder="Describe the task in detail"></textarea>


            <!-- SUBMIT -->

            <button
                class="submit-btn"
                onclick="addTask()">

                Submit

            </button>


            <!-- MESSAGE -->

            <div id="addMessage"></div>

        </section>


        <!-- ========================= -->
        <!-- FOLLOW UP -->
        <!-- ========================= -->

        <section
            id="followUp"
            class="section"
            style="display: none;">

            <h2>Today's Follow Up</h2>

            <div id="todayTasks"></div>

        </section>


        <!-- ========================= -->
        <!-- ALL PENDING TASKS -->
        <!-- ========================= -->

        <section
            id="pendingTasks"
            class="section"
            style="display: none;">

            <!-- SEARCH BY NAME -->

            <input
                type="text"
                id="searchName"
                placeholder="Search Name..."
                onkeyup="filterTasks()">


            <!-- SEARCH BY TASK -->

            <input
                type="text"
                id="searchTask"
                placeholder="Search Task..."
                onkeyup="filterTasks()">


            <!-- TASK TABLE -->

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>id</th>

                            <th>Name</th>

                            <th>Task</th>

                            <th>
                                Planned<br>
                                Date
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="taskTable">

                        <!-- Tasks will be loaded here -->

                    </tbody>

                </table>

            </div>

        </section>

    </div>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="app.js"></script>

</body>

</html>
